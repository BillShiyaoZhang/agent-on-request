name: agent-on-request-hermes-demo

x-hermes: &hermes
  image: agent-on-request/hermes-demo-gateway:0.22.7
  build:
    context: .
    dockerfile: docker/hermes/Dockerfile
    additional_contexts:
      kg_source: ${KG_PLUGIN_SOURCE:-../hermes-kg-plugin}
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  secrets:
    - source: minimax_cn_api_key
      uid: '0'
      mode: 0400

services:
  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/local-demo-graph-password
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    networks: [graph_link]
    volumes: [graph_data:/data]
    healthcheck:
      test: [CMD-SHELL, "cypher-shell -u neo4j -p local-demo-graph-password 'RETURN 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 40

  hermes-alice:
    <<: *hermes
    environment:
      DEMO_HERMES_ROLE: Alice
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DEMO_ALICE_KG_PORT:-8765}:8765"
      - "127.0.0.1:${DEMO_ALICE_HERMES_PORT:-9119}:9129"
    networks:
      alice_link:
      graph_link:
      alice_egress:
        gw_priority: 1
    volumes:
      - alice_profile:/opt/data
      - alice_gateway_auth:/run/demo-gateway-auth

  hermes-bob:
    <<: *hermes
    environment:
      DEMO_HERMES_ROLE: Bob
      HERMES_DASHBOARD_PORT: 9121
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DEMO_BOB_KG_PORT:-8766}:8765"
      - "127.0.0.1:${DEMO_BOB_HERMES_PORT:-9121}:9129"
    networks:
      bob_link:
      graph_link:
      bob_egress:
        gw_priority: 1
    volumes:
      - bob_profile:/opt/data
      - bob_gateway_auth:/run/demo-gateway-auth

  kg-alice:
    image: agent-on-request/kg-native-console:local
    build:
      context: .
      dockerfile: docker/kg/Dockerfile
      additional_contexts:
        kg_source: ${KG_PLUGIN_SOURCE:-../hermes-kg-plugin}
    user: "10000:10000"
    restart: unless-stopped
    network_mode: service:hermes-alice
    environment:
      HERMES_HOME: /opt/data
      DEMO_KG_ROLE: Alice
      KG_CONSOLE_TOKEN_FILE: /opt/data/kg-console.token
      DEMO_KG_SERVICE_TOKEN_FILE: /opt/data/kg-service.token
      KG_STATIC_DIR: /app/static
      KG_SYNC_SCHEDULER_ENABLED: "false"
    volumes:
      - alice_profile:/opt/data
    depends_on:
      hermes-alice:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import json; from pathlib import Path; from urllib.request import Request,urlopen; r=urlopen(Request('http://127.0.0.1:8765/api/v1/status',headers={'Authorization':'Bearer '+Path('/opt/data/kg-console.token').read_text().strip()}),timeout=4); assert r.status==200 and json.load(r).get('connected') is True"]
      interval: 5s
      timeout: 6s
      retries: 30
      start_period: 15s

  kg-bob:
    image: agent-on-request/kg-native-console:local
    build:
      context: .
      dockerfile: docker/kg/Dockerfile
      additional_contexts:
        kg_source: ${KG_PLUGIN_SOURCE:-../hermes-kg-plugin}
    user: "10000:10000"
    restart: unless-stopped
    network_mode: service:hermes-bob
    environment:
      HERMES_HOME: /opt/data
      DEMO_KG_ROLE: Bob
      KG_CONSOLE_TOKEN_FILE: /opt/data/kg-console.token
      DEMO_KG_SERVICE_TOKEN_FILE: /opt/data/kg-service.token
      KG_STATIC_DIR: /app/static
      KG_SYNC_SCHEDULER_ENABLED: "false"
    volumes:
      - bob_profile:/opt/data
    depends_on:
      hermes-bob:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import json; from pathlib import Path; from urllib.request import Request,urlopen; r=urlopen(Request('http://127.0.0.1:8765/api/v1/status',headers={'Authorization':'Bearer '+Path('/opt/data/kg-console.token').read_text().strip()}),timeout=4); assert r.status==200 and json.load(r).get('connected') is True"]
      interval: 5s
      timeout: 6s
      retries: 30
      start_period: 15s

  demo:
    image: agent-on-request/hermes-demo-app:local
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      DEMO_HERMES_ALICE_URL: http://127.0.0.1:8643
      DEMO_HERMES_BOB_URL: http://127.0.0.1:8644
      DEMO_KG_ALICE_URL: http://hermes-alice:8765
      DEMO_KG_BOB_URL: http://hermes-bob:8765
      DEMO_KG_ALICE_PUBLIC_URL: http://127.0.0.1:${DEMO_ALICE_KG_PORT:-8765}/?view=graph
      DEMO_KG_BOB_PUBLIC_URL: http://127.0.0.1:${DEMO_BOB_KG_PORT:-8766}/?view=graph
      DEMO_HERMES_ALICE_PUBLIC_URL: http://127.0.0.1:${DEMO_ALICE_HERMES_PORT:-9119}
      DEMO_HERMES_BOB_PUBLIC_URL: http://127.0.0.1:${DEMO_BOB_HERMES_PORT:-9121}
    depends_on:
      hermes-alice:
        condition: service_healthy
      hermes-bob:
        condition: service_healthy
      kg-alice:
        condition: service_healthy
      kg-bob:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DEMO_DOCKER_PORT:-4327}:4328"
    networks:
      ingress:
        interface_name: eth0
        gw_priority: 1
      alice_link:
        interface_name: eth1
      bob_link:
        interface_name: eth2
    volumes:
      - demo_data:/app/.data
      - alice_gateway_auth:/run/demo-gateway-auth/alice:ro
      - bob_gateway_auth:/run/demo-gateway-auth/bob:ro
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4327/api/meta').then(async r => { if (!r.ok || !(await r.json()).live.available) process.exitCode=1 }).catch(() => { process.exitCode=1 })"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 15s

networks:
  ingress:
  alice_link:
    internal: true
  bob_link:
    internal: true
  alice_egress:
  bob_egress:
  graph_link:
    internal: true

volumes:
  alice_profile:
  bob_profile:
  alice_gateway_auth:
  bob_gateway_auth:
  demo_data:
  graph_data:

secrets:
  minimax_cn_api_key:
    environment: MINIMAX_CN_API_KEY
